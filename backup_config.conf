#===========================================#
# USB DRIVE BACKUP CONFIGURATION #
#===========================================#

# Directories to back up (space-separated)
BACKUP_DIRS="/etc /home"

# Additional configuration
BACKUP_NAME="primary_server"
EXCLUDE_PATTERNS="*.tmp *.log.* /var/log/journal/*"

# Sysadmin information
SYSADMIN_NAME="Administrator"
BACKUP_DESCRIPTION="Automatic backup of critical directories"

# This file must be in the root of the USB drive